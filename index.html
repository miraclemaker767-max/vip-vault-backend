<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPVaultMedia</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #15181e;
            --accent-gold: #e2b74b;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --border-color: #262a33;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px;
            padding-bottom: 40px;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--accent-gold);
            font-size: 18px;
        }

        .brand-title {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .brand-subtitle {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .vip-btn {
            background: linear-gradient(135deg, #e2b74b 0%, #c59b32 100%);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(226, 183, 75, 0.2);
        }

        .hero-banner {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        .hero-tag {
            font-size: 10px;
            letter-spacing: 1.5px;
            color: var(--accent-gold);
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .hero-title {
            font-size: 22px;
            font-weight: 800;
            margin: 0 0 6px 0;
            line-height: 1.2;
        }

        .hero-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0 0 12px 0;
            line-height: 1.4;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }

        .controls-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .search-box::placeholder {
            color: var(--text-muted);
        }

        .refresh-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            cursor: pointer;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 800;
            margin: 0;
        }

        .section-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin: 2px 0 0 0;
        }

        .video-count-badge {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .video-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .thumbnail-container {
            width: 100%;
            height: 110px;
            background: linear-gradient(135deg, #1f242d 0%, #111318 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .featured-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(226, 183, 75, 0.3);
            color: var(--accent-gold);
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .play-icon-overlay {
            width: 36px;
            height: 36px;
            background: rgba(226, 183, 75, 0.15);
            border: 1px solid rgba(226, 183, 75, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-gold);
            font-size: 14px;
        }

        .card-content {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .video-title {
            font-size: 12px;
            font-weight: 600;
            margin: 0 0 10px 0;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .watch-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .empty-state {
            grid-column: span 2;
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="brand-section">
            <div class="brand-logo">V</div>
            <div>
                <div class="brand-title">VIP CONTENT VAULT</div>
                <div class="brand-subtitle">CURATED VIDEO COLLECTION</div>
            </div>
        </div>
        <button class="vip-btn" onclick="alert('VIP Access unlocked via Telegram Premium')">
            ⚡ VIP ACCESS
        </button>
    </div>

    <div class="hero-banner">
        <div class="hero-tag">— The Premium Collection</div>
        <div class="hero-title">Your next watch starts here.</div>
        <div class="hero-desc">Explore the latest available videos in a clean, cinematic browsing experience.</div>
        <div class="status-indicator">
            <div class="status-dot"></div>
            <span id="status-text">Catalog connected</span>
        </div>
    </div>

    <div class="controls-row">
        <input type="text" id="searchInput" class="search-box" placeholder="Search the collection..." oninput="filterVideos()">
        <button class="refresh-btn" onclick="fetchVideos()">🔄</button>
    </div>

    <div class="section-header">
        <div>
            <h2 class="section-title">Explore collection</h2>
            <p class="section-subtitle">The latest additions, all in one place</p>
        </div>
        <div class="video-count-badge" id="videoCountBadge">0 VIDEOS</div>
    </div>

    <div style="height: 12px;"></div>

    <div class="video-grid" id="videoGrid">
        <!-- Dynamic videos load here -->
    </div>

    <script>
        const BACKEND_URL = "https://vip-vault-backend-xxxx.onrender.com"; // Replace with your Render URL
        let allVideos = [];

        async function fetchVideos() {
            try {
                document.getElementById('status-text').innerText = "Syncing catalog...";
                const response = await fetch(`${BACKEND_URL}/api/videos`);
                const data = await response.json();
                
                if (data.success) {
                    allVideos = data.videos;
                    renderVideos(allVideos);
                    document.getElementById('status-text').innerText = "Catalog connected";
                    document.getElementById('videoCountBadge').innerText = `${allVideos.length} VIDEOS`;
                }
            } catch (err) {
                console.error('Failed to load videos:', err);
                document.getElementById('status-text').innerText = "Connection error";
            }
        }

        function renderVideos(videos) {
            const grid = document.getElementById('videoGrid');
            
            if (videos.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 24px; margin-bottom: 8px;">📭</div>
                        <div style="font-weight: 700; color: #fff; margin-bottom: 4px;">Nothing to show yet</div>
                        <div style="font-size: 11px;">Upload a video to your Telegram channel to populate the vault.</div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = videos.map(video => `
                <div class="video-card">
                    <div class="thumbnail-container">
                        <div class="featured-badge">FEATURED</div>
                        <div class="play-icon-overlay">▶</div>
                    </div>
                    <div class="card-content">
                        <div class="video-title">${escapeHtml(video.title)}</div>
                        <button class="watch-btn" onclick="window.open('${video.videoUrl}', '_blank')">
                            ▶ WATCH VIDEO
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function filterVideos() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allVideos.filter(v => v.title.toLowerCase().includes(query));
            renderVideos(filtered);
            document.getElementById('videoCountBadge').innerText = `${filtered.length} VIDEOS`;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Load videos on startup
        fetchVideos();
    </script>
</body>
</html>
