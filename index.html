<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPVaultMedia</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.js"></script>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #15181e;
            --accent-gold: #e2b74b;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --border-color: #262a33;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px;
            padding-bottom: 40px;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: var(--accent-gold);
            font-size: 18px;
        }

        .brand-title {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .brand-subtitle {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .vip-btn {
            background: linear-gradient(135deg, #e2b74b 0%, #c59b32 100%);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(226, 183, 75, 0.2);
        }

        .hero-banner {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        .hero-tag {
            font-size: 10px;
            letter-spacing: 1.5px;
            color: var(--accent-gold);
            font-weight: 800;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .hero-title {
            font-size: 21px;
            font-weight: 800;
            margin: 0 0 6px 0;
            line-height: 1.2;
        }

        .hero-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0 0 12px 0;
            line-height: 1.4;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }

        .controls-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .search-box::placeholder {
            color: var(--text-muted);
        }

        .refresh-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            cursor: pointer;
            font-size: 15px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.2px;
        }

        .section-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin: 2px 0 0 0;
            font-weight: 500;
        }

        .video-count-badge {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .video-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .thumbnail-container {
            width: 100%;
            height: 115px;
            background-color: #111318;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .featured-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(226, 183, 75, 0.3);
            color: var(--accent-gold);
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            z-index: 2;
        }

        .play-icon-overlay {
            width: 36px;
            height: 36px;
            background: rgba(226, 183, 75, 0.2);
            border: 1px solid rgba(226, 183, 75, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-gold);
            font-size: 13px;
            z-index: 2;
            backdrop-filter: blur(3px);
        }

        .card-content {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .video-title {
            font-size: 12px;
            font-weight: 700;
            margin: 0 0 10px 0;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #f3f4f6;
        }

        .watch-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            letter-spacing: 0.3px;
        }

        .empty-state {
            grid-column: span 2;
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-muted);
        }

        .empty-icon-wrapper {
            width: 48px;
            height: 48px;
            background: rgba(226, 183, 75, 0.08);
            border: 1px solid rgba(226, 183, 75, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px auto;
        }

        /* IN-APP VIDEO PLAYER MODAL */
        #playerModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
        }

        .modal-content-wrapper {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 380px;
        }

        .close-modal-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
            padding: 0 4px;
        }

        .video-player-container {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            max-height: 70vh;
            outline: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="brand-section">
            <div class="brand-logo">V</div>
            <div>
                <div class="brand-title">VIP CONTENT VAULT</div>
                <div class="brand-subtitle">CURATED COLLECTION</div>
            </div>
        </div>
        <button class="vip-btn" onclick="alert('VIP Access unlocked via Telegram Premium')">
            ⚡ VIP ACCESS
        </button>
    </div>

    <div class="hero-banner">
        <div class="hero-tag">— The Premium Collection</div>
        <div class="hero-title">Your next watch starts here.</div>
        <div class="hero-desc">Explore the latest available videos in a clean, cinematic browsing experience.</div>
        <div class="status-indicator">
            <div class="status-dot"></div>
            <span id="status-text">Catalog connected</span>
        </div>
    </div>

    <div class="controls-row">
        <input type="text" id="searchInput" class="search-box" placeholder="Search the collection..." oninput="filterVideos()">
        <button class="refresh-btn" onclick="fetchVideos()">🔄</button>
    </div>

    <div class="section-header">
        <div>
            <h2 class="section-title">Explore collection</h2>
            <p class="section-subtitle">The latest additions, all in one place</p>
        </div>
        <div class="video-count-badge" id="videoCountBadge">0 VIDEOS</div>
    </div>

    <div style="height: 12px;"></div>

    <div class="video-grid" id="videoGrid">
        <!-- Dynamic videos load here -->
    </div>

    <!-- IN-APP VIDEO STREAMING MODAL -->
    <div id="playerModal">
        <div class="modal-content-wrapper">
            <div class="modal-header">
                <div class="modal-title" id="modalVideoTitle">Streaming Video</div>
                <button class="close-modal-btn" onclick="closePlayer()">×</button>
            </div>
            <div class="video-player-container">
                <video id="activeVideoPlayer" controls autoplay playsinline></video>
            </div>
        </div>
    </div>

    <script>
        // REPLACE WITH YOUR LIVE RENDER BACKEND URL
        const BACKEND_URL = "https://vip-vault-backend-n771.onrender.com"; 

        // INITIALIZE ADSGRAM (Replace with your actual block ID from adsgram.ai if desired)
        const adController = window.Adsgram ? window.Adsgram.init({ blockId: "YOUR_ADSGRAM_BLOCK_ID" }) : null;

        let allVideos = [];

        async function fetchVideos() {
            try {
                document.getElementById('status-text').innerText = "Syncing catalog...";
                const response = await fetch(`${BACKEND_URL}/api/videos`);
                const data = await response.json();
                
                if (data.success) {
                    allVideos = data.videos;
                    renderVideos(allVideos);
                    document.getElementById('status-text').innerText = "Catalog connected";
                    document.getElementById('videoCountBadge').innerText = `${allVideos.length} VIDEOS`;
                }
            } catch (err) {
                console.error('Failed to load videos:', err);
                document.getElementById('status-text').innerText = "Connection error";
            }
        }

        function renderVideos(videos) {
            const grid = document.getElementById('videoGrid');
            
            if (videos.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon-wrapper">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e2b74b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </div>
                        <div style="font-weight: 700; color: #ffffff; font-size: 14px; margin-bottom: 6px;">Nothing to show yet</div>
                        <div style="font-size: 11px; color: var(--text-muted); max-width: 260px; margin: 0 auto; line-height: 1.4;">
                            The catalog is reachable, but it has no entries right now. Upload a video to your Telegram channel to populate the vault.
                        </div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = videos.map(video => {
                const thumbStyle = video.thumbnailUrl 
                    ? `background: linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0.35)), url('${video.thumbnailUrl}') center/cover no-repeat;`
                    : `background: linear-gradient(135deg, #1f242d 0%, #111318 100%);`;

                // Escape single quotes for safety in inline function calls
                const safeTitle = video.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeUrl = video.videoUrl;

                return `
                    <div class="video-card">
                        <div class="thumbnail-container" style="${thumbStyle}">
                            <div class="featured-badge">FEATURED</div>
                            <div class="play-icon-overlay">▶</div>
                        </div>
                        <div class="card-content">
                            <div class="video-title">${escapeHtml(video.title)}</div>
                            <button class="watch-btn" onclick="handleWatchClick('${safeUrl}', '${safeTitle}')">
                                ▶ WATCH VIDEO
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Handle Ad + In-App Player Modal Trigger
        function handleWatchClick(videoUrl, videoTitle) {
            if (adController) {
                adController.show().then((result) => {
                    openPlayer(videoUrl, videoTitle);
                }).catch((err) => {
                    console.log("Ad skipped or failed", err);
                    openPlayer(videoUrl, videoTitle);
                });
            } else {
                openPlayer(videoUrl, videoTitle);
            }
        }

        function openPlayer(url, title) {
            const modal = document.getElementById('playerModal');
            const player = document.getElementById('activeVideoPlayer');
            const titleEl = document.getElementById('modalVideoTitle');

            titleEl.innerText = title;
            player.src = url;
            modal.style.display = 'flex';
            player.play().catch(e => console.log("Autoplay blocked:", e));
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const player = document.getElementById('activeVideoPlayer');
            
            player.pause();
            player.src = '';
            modal.style.display = 'none';
        }

        function filterVideos() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allVideos.filter(v => v.title.toLowerCase().includes(query));
            renderVideos(filtered);
            document.getElementById('videoCountBadge').innerText = `${filtered.length} VIDEOS`;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Load catalog on startup
        fetchVideos();
    </script>
</body>
</html>
